<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI to Agent 學習教材</title>
<meta name="description" content="AI to Agent 學習教材：知識原理、任務設計與實作應用。手機可操作的互動式電子書，支援放大字體。">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --fs:18px;
  --bg:#f5f8fc; --surface:#fff; --ink:#0f2a44; --ink2:#4a6580; --line:#e1e9f2;
  --blue:#1565c0; --teal:#0f8f86; --gold:#9a6b00; --ok:#2e7d32;
  --r:16px; --shadow:0 1px 2px rgba(15,42,68,.06),0 4px 16px rgba(15,42,68,.06);
}
html.big{--fs:23px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid #ffb300;outline-offset:2px}

/* 頂部列 */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{font-weight:900;color:var(--blue);font-size:17px;white-space:nowrap}
.back{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--ink2);font-size:16px;min-height:44px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fsbtn{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:16px;color:var(--ink)}
.fsbtn b{font-size:20px;line-height:1}
.fsbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

h1{font-size:clamp(1.8rem,7vw,2.4rem);line-height:1.25;margin:0;font-weight:900;letter-spacing:.01em}
h2{font-size:1.25rem;line-height:1.4;margin:0}
.kicker{font-size:.72rem;letter-spacing:.18em;font-weight:700;color:var(--ink2)}
section{padding:28px 0 0}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}

/* 首頁 */
.hero{padding:36px 0 8px}
.hero .sub{color:var(--ink2);margin:.4em 0 1.2em}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:1.05rem}
.cta small{font-weight:400;opacity:.85;font-size:.85em}

.part{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.part-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-left:6px solid var(--c)}
.part-head .pt{font-weight:900;font-size:1.15rem}
.part-head .pr{margin-left:auto;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.chlist{list-style:none;margin:0;padding:0 0 6px}
.chitem{display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:64px;border-top:1px solid var(--line)}
.chitem:active{background:#f1f5fa}
.num{flex:none;width:2.2rem;font-weight:900;font-size:1.05rem;color:var(--c);font-variant-numeric:tabular-nums}
.chitem .tt{display:block;font-weight:700;line-height:1.45}
.chitem .ss{display:block;font-size:.8rem;color:var(--ink2);line-height:1.45;margin-top:2px}
.chitem .mk{margin-left:auto;flex:none;font-size:.8rem;color:var(--ok);font-weight:700}
.chitem .arr{margin-left:auto;flex:none;color:#b5c3d1;font-size:1.2rem}
.chitem .mk + .arr{margin-left:6px}

/* 作者 */
.author{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.author .name{font-size:1.6rem;font-weight:900;margin:0}
.author .role{color:var(--blue);font-weight:700;margin-bottom:12px}
.author p{margin:.7em 0;color:#22405d}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px;font-size:.75rem;color:var(--ink2);line-height:1.35}
.stats b{display:block;font-size:1.15rem;color:var(--gold)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:700;color:var(--blue)}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}

/* 閱讀器 */
.reader{padding-top:16px}
.ch-no{font-size:.8rem;font-weight:700;color:var(--c)}
.reader h2{margin:2px 0 14px}
.slide{position:relative;display:block;width:100%;padding:0;border:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:16/9;cursor:zoom-in}
.slide img{display:block;width:100%;height:100%;object-fit:contain}
.slide .zi{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;background:rgba(15,42,68,.6);color:#fff;display:grid;place-items:center;font-size:18px}
.bar{height:4px;background:var(--line);border-radius:999px;margin:12px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .25s}
.pagetext{margin-top:16px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.pagetext p{margin:.25em 0}
.pagetext p.h{font-weight:900;font-size:1.15rem;margin-bottom:.4em}

.dock{position:sticky;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:24px;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.dock .wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nb{min-height:56px;border-radius:14px;border:0;font-weight:700;font-size:1rem;padding:0 10px}
.nb.prev{background:#eef3f9;color:var(--ink)}
.nb.next{background:var(--blue);color:#fff}
.nb:disabled{opacity:.35;cursor:default}
.count{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:center;font-size:.95rem}

/* 全螢幕放大 */
.lightbox{position:fixed;inset:0;z-index:100;background:#0b1622;display:none;overflow:auto}
.lightbox.on{display:flex;align-items:center}
.lightbox img{display:block;width:100%;height:auto}
.lightbox .close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;width:52px;height:52px;border-radius:50%;border:0;background:#fff;font-size:24px;font-weight:900;box-shadow:0 4px 16px rgba(0,0,0,.4)}
@media (orientation:landscape){.lightbox img{width:auto;max-width:100%;max-height:100vh;margin:0 auto}}

footer{text-align:center;padding:36px 16px 40px;color:var(--ink2);font-size:.8rem}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <span id="nav"></span>
    <button class="fsbtn" id="fsbtn" aria-pressed="false" aria-label="放大字體"><b>A</b><span id="fslabel">放大字體</span></button>
  </div>
</header>

<main id="app"></main>

<div class="lightbox" id="lb" role="dialog" aria-label="放大檢視投影片" onclick="if(event.target===this)closeLB()">
  <img id="lbimg" alt="">
  <button class="close" onclick="closeLB()" aria-label="關閉">✕</button>
</div>

<script src="data.js"></script>
<script>
const B = window.BOOK;
const COLORS = {blue:'#1565c0', teal:'#0f8f86', gold:'#b07a00'};
const $app = document.getElementById('app'), $nav = document.getElementById('nav');
const store = {
  get(k, d){ try{ const v = localStorage.getItem('aitoagent:'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('aitoagent:'+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const img = n => `img/p${String(n).padStart(3, '0')}.webp`;
const partOf = no => B.parts.find(p => no >= p.chapters[0] && no <= p.chapters[1]);
const chaptersOf = p => B.chapters.filter(c => c.no >= p.chapters[0] && c.no <= p.chapters[1]);
const doneSet = () => new Set(store.get('done', []));
const go = h => { location.hash = h; };

/* 字體：標準／放大 */
const fsbtn = document.getElementById('fsbtn');
function setBig(on){
  document.documentElement.classList.toggle('big', on);
  fsbtn.setAttribute('aria-pressed', on);
  document.getElementById('fslabel').textContent = on ? '標準字體' : '放大字體';
  fsbtn.setAttribute('aria-label', on ? '改回標準字體' : '放大字體');
  store.set('big', on);
}
fsbtn.onclick = () => setBig(!document.documentElement.classList.contains('big'));
setBig(store.get('big', false));

/* 共用 */
function chItem(c){
  const p = partOf(c.no);
  return `<li><a class="chitem" href="#/ch/${c.no}" style="--c:${COLORS[p.color]}">
    <span class="num">${pad(c.no)}</span>
    <span><span class="tt">${esc(c.title)}</span><span class="ss">${esc(c.sub)}</span></span>
    ${doneSet().has(c.no) ? '<span class="mk">✓ 讀完</span>' : ''}<span class="arr" aria-hidden="true">›</span></a></li>`;
}
function partBlock(p, extra = ''){
  return `<div class="part" style="--c:${COLORS[p.color]}">
    <div class="part-head"><span class="pt">${p.name}｜${p.title}</span><span class="pr">第 ${pad(p.chapters[0])}–${pad(p.chapters[1])} 章</span></div>
    <ul class="chlist">${chaptersOf(p).map(chItem).join('')}${extra}</ul>
  </div>`;
}

/* 首頁 */
function homeView(){
  $nav.innerHTML = `<span class="brand">AI to Agent</span>`;
  const last = store.get('last', null);
  const ending = `<li><a class="chitem" href="#/end"><span class="num">結</span><span><span class="tt">全書結語</span><span class="ss">以人為本，回歸需求</span></span><span class="arr" aria-hidden="true">›</span></a></li>`;
  return `<div class="wrap">
    <section class="hero">
      <div class="kicker">AI TO AGENT</div>
      <h1>AI to Agent<br>學習教材</h1>
      <p class="sub">知識原理、任務設計與實作應用</p>
      ${last ? `<a class="cta" href="#/ch/${last.ch}/${last.i}">繼續閱讀 <small>第 ${pad(last.ch)} 章・第 ${last.i + 1} 頁</small></a>`
             : `<a class="cta" href="#/ch/1">開始閱讀</a>`}
    </section>
    <section aria-labelledby="toc">
      <div class="sec-title"><h2 id="toc">全書目錄</h2><span class="kicker">21 章</span></div>
      ${B.parts.map((p, k) => partBlock(p, k === 2 ? ending : '')).join('')}
    </section>
    <section aria-labelledby="au">
      <div class="sec-title"><h2 id="au">作者介紹</h2></div>
      <div class="author">
        <p class="name">陳俊宏</p>
        <div class="role">AI Coach 益力康陳董 × CGM Coach 血糖教練</div>
        <div class="stats">
          <div><b>25+ 年</b>製造業經營</div><div><b>10+ 年</b>授課資歷</div>
          <div><b>100+ 場</b>授課場次</div><div><b>多次</b>公益獲獎</div>
        </div>
        <p>國立交通大學資訊工程系畢業，新加坡國立大學 MBA、國立台南大學 EMBA。益力康生物科技董事長、益生寵愛寵物餐廳創辦人，擁有超過 25 年製造業經營實戰經驗。</p>
        <p>資策會生成式 AI 認證講師、工研院產業輔導團 AI 認證講師；於嘉義大學、嘉南藥理大學、元培大學、中信科大擔任業界講師，授課超過一百場。</p>
        <p>提出 Visual Agent Design（VAD）、Visual Agent Card（VAC）、RE:Agent 等方法並公開於 GitHub。本書為作者第三本著作。</p>
        <div class="links">
          <a href="https://www.easycure.com.tw" target="_blank" rel="noopener">益力康官網</a>
          <a href="https://github.com/draiagent" target="_blank" rel="noopener">GitHub</a>
          <a href="https://draiagent.github.io/" target="_blank" rel="noopener">作者首頁</a>
        </div>
      </div>
    </section>
  </div>`;
}

/* 篇章頁 */
function partView(id){
  const p = B.parts.find(x => x.id == id); if(!p) return homeView();
  $nav.innerHTML = `<a class="back" href="#/">‹ 目錄</a>`;
  const nextP = B.parts.find(x => x.id == p.id + 1);
  return `<div class="wrap"><section>${partBlock(p)}
    ${nextP ? `<a class="cta" href="#/part/${nextP.id}">下一篇：${nextP.title}</a>` : `<a class="cta" href="#/end">全書結語</a>`}
  </section></div>`;
}

/* 閱讀器 */
let R = null;
function readerView(range, i, meta){
  const pages = []; for(let n = range.start; n <= range.end; n++) pages.push(n);
  i = Math.max(0, Math.min(i || 0, pages.length - 1));
  R = {pages, i, meta};
  if(meta.ch) store.set('last', {ch: meta.ch, i});
  $nav.innerHTML = `<a class="back" href="${meta.back}">‹ ${meta.backLabel}</a>`;
  return `<div class="wrap reader" style="--c:${meta.color}">
    <div class="ch-no">${meta.kicker}</div>
    <h2>${meta.title}</h2>
    <button class="slide" onclick="openLB()" aria-label="放大投影片"><img id="slideimg" alt=""><span class="zi" aria-hidden="true">⤢</span></button>
    <div class="bar"><i id="pgbar"></i></div>
    <div class="pagetext" id="lines"></div>
  </div>
  <div class="dock"><div class="wrap">
    <button class="nb prev" id="bprev" onclick="turn(-1)">‹ 上一頁</button>
    <span class="count" id="count"></span>
    <button class="nb next" id="bnext" onclick="turn(1)">下一頁 ›</button>
  </div></div>`;
}
function paintPage(){
  const {pages, i, meta} = R, n = pages[i];
  const $img = document.getElementById('slideimg');
  $img.src = img(n); $img.alt = `第 ${i + 1} 頁投影片`;
  document.getElementById('count').textContent = `${i + 1} / ${pages.length}`;
  document.getElementById('pgbar').style.width = ((i + 1) / pages.length * 100) + '%';
  const lines = (B.pages[n] || []).filter(l => !/^[A-Z][A-Z ·\-:0-9]*$/.test(l));
  const box = document.getElementById('lines');
  box.hidden = !lines.length;
  box.innerHTML = lines.map((l, k) => `<p class="${k === 0 ? 'h' : ''}">${esc(l)}</p>`).join('');
  const prev = document.getElementById('bprev'), next = document.getElementById('bnext');
  prev.disabled = i === 0 && !meta.prev;
  prev.textContent = i === 0 && meta.prev ? '‹ 上一章' : '‹ 上一頁';
  next.textContent = i === pages.length - 1 ? (meta.next ? '下一章 ›' : '讀完了 ✓') : '下一頁 ›';
  if(pages[i + 1]){ const pre = new Image(); pre.src = img(pages[i + 1]); }
}
function turn(d){
  const {pages, i, meta} = R, j = i + d;
  if(j < 0){ if(meta.prev) go(meta.prev); return; }
  if(j >= pages.length){
    if(meta.ch){ const s = doneSet(); s.add(meta.ch); store.set('done', [...s]); }
    go(meta.next || '#/'); return;
  }
  R.i = j;
  history.replaceState(null, '', meta.base + '/' + j);
  if(meta.ch) store.set('last', {ch: meta.ch, i: j});
  paintPage(); window.scrollTo({top: 0, behavior: 'smooth'});
}

/* 放大檢視 */
function openLB(){ document.getElementById('lbimg').src = img(R.pages[R.i]); document.getElementById('lb').classList.add('on'); document.body.style.overflow = 'hidden'; }
function closeLB(){ document.getElementById('lb').classList.remove('on'); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeLB();
  if(R && !document.getElementById('lb').classList.contains('on')){
    if(e.key === 'ArrowRight') turn(1);
    if(e.key === 'ArrowLeft') turn(-1);
  }
});
/* 投影片左右滑動翻頁 */
let sx = null, sy = null;
document.addEventListener('touchstart', e => {
  if(e.touches.length === 1 && e.target.closest('.slide')){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null;
}, {passive: true});
document.addEventListener('touchend', e => {
  if(sx === null || !R) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){ e.preventDefault(); turn(dx < 0 ? 1 : -1); }
});

/* 路由 */
function render(){
  closeLB(); R = null;
  const h = location.hash.replace(/^#\/?/, '').split('/');
  let html, after = null;
  if(h[0] === 'part') html = partView(+h[1]);
  else if(h[0] === 'ch' && B.chapters.some(x => x.no == h[1])){
    const c = B.chapters.find(x => x.no == h[1]), p = partOf(c.no);
    const prevC = B.chapters.find(x => x.no == c.no - 1), nextC = B.chapters.find(x => x.no == c.no + 1);
    html = readerView(c, +h[2] || 0, {
      ch: c.no, base: '#/ch/' + c.no, back: '#/part/' + p.id, backLabel: `${p.name}｜${p.title}`,
      color: COLORS[p.color], kicker: `第 ${pad(c.no)} 章・${esc(c.sub)}`, title: esc(c.title),
      prev: prevC ? '#/ch/' + prevC.no : null,
      next: nextC ? '#/ch/' + nextC.no : '#/end'
    });
    after = paintPage;
  }
  else if(h[0] === 'end'){
    html = readerView(B.epilogue, +h[1] || 0, {base: '#/end', back: '#/', backLabel: '目錄', color: COLORS.gold,
      kicker: '全書結語', title: '以人為本，回歸需求', prev: '#/ch/21', next: null});
    after = paintPage;
  }
  else html = homeView();
  $app.innerHTML = html + `<footer>AI Coach 益力康陳董 × CGM Coach 血糖教練<br>© 2026 CC BY-SA 4.0</footer>`;
  if(after) after();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
